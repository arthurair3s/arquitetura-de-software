name: express-delivery

services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped
    networks:
      - app-network

  ms-entregadores:
    build:
      context: .
      dockerfile: ms-entregadores-cs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5001
      ConnectionStrings__DefaultConnection: Host=postgres_db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASS}
      ConnectionStrings__RedisConnection: redis:6379
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '5001:5001'
    restart: unless-stopped
    networks:
      - app-network

  ms-roteamento:
    build:
      context: .
      dockerfile: ms-roteamento-cs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5002
      OSRM_URL: http://172.25.0.10:5000/
    depends_on:
      osrm-server:
        condition: service_started
    ports:
      - '5002:5002'
    restart: unless-stopped
    networks:
      - app-network

  osrm-server:
    image: osrm/osrm-backend
    ports:
      - '5080:5000'
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/sudeste-260509.osrm
    restart: unless-stopped
    networks:
      app-network:
        ipv4_address: 172.25.0.10

  api:
    build:
      context: ./api-node
      dockerfile: Dockerfile
    expose:
      - '4000'
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres_db:5432/${DB_NAME}?schema=public
      ENTREGADORES_SERVICE_URL: ms-entregadores:5001
      ROTEAMENTO_SERVICE_URL: ms-roteamento:5002
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres_db:
        condition: service_healthy
      ms-entregadores:
        condition: service_started
      ms-roteamento:
        condition: service_started
    volumes:
      - ./api-node:/app
      - /app/node_modules
      - ./protos:/app/protos
    command: sh -c "npm install && npx prisma generate && npx prisma db push --force-reset && npx prisma db seed && npm run dev"
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    expose:
      - '5173'
    depends_on:
      - api
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    networks:
      - app-network

  kong:
    image: kong:3.4
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_LOG_LEVEL: notice
      KONG_VAULT_ENV_PREFIX: SECRET_
      SECRET_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./kong:/usr/local/kong/declarative
    ports:
      - '8000:8000'
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
