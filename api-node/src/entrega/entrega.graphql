type Entrega {
  id: ID!
  pedido: Pedido!
  entregador: Entregador
  status: String
  previsao_entrega: String
  rota: GeometriaRota
  resumo_trajeto: ResumoRota
  rota_coleta: GeometriaRota
  rota_entrega: GeometriaRota
}

extend type Pedido {
  entregas: [Entrega]
}

extend type Entregador {
  entregas: [Entrega]
}

extend type Query {
  entregas: [Entrega] @auth
  entrega(id: ID!): Entrega @auth
  entregasPendentes: [Entrega] @auth(roles: ["ENTREGADOR"])
}

extend type Mutation {
  criarEntrega(
    pedido_id: ID!
    entregador_id: ID
    status: String
    previsao_entrega: String
  ): Entrega @auth(roles: ["RESTAURANTE"])

  editarEntrega(
    id: ID!
    pedido_id: ID
    entregador_id: ID
    status: String
    previsao_entrega: String
  ): Entrega @auth

  deletarEntrega(id: ID!): Boolean @auth(roles: ["RESTAURANTE"])

  # Controles de simulação: qualquer usuário autenticado, porque o painel do
  # cliente também dispara o deslocamento na demo.
  simularDeslocamento(id: ID!): Boolean @auth

  atribuirEntregador(pedido_id: ID!): Entrega @auth

  # `entregador_id` removido: quem aceita a corrida é o entregador do token.
  aceitarEntrega(entrega_id: ID!): Entrega @auth(roles: ["ENTREGADOR"])
}
