type Usuario {
  id: ID!
  nome: String!
  email: String!
  telefone: String
  latitude: Float
  longitude: Float
  endereco: String
  role: String
  entregador_id: Int
  restaurante_id: Int
}

type LoginResponse {
  token: String!
  usuario: Usuario!
}

extend type Query {
  usuarios: [Usuario] @auth(roles: ["RESTAURANTE"])
  usuario(id: ID!): Usuario @auth
  me: Usuario @auth
}

extend type Mutation {
  login(email: String!, senha: String!): LoginResponse

  criarUsuario(
    nome: String!
    email: String!
    telefone: String
    senha: String!
    role: String
    entregador_id: Int
    restaurante_id: Int
  ): Usuario

  # Sem `role`/`entregador_id`/`restaurante_id`: são campos administrativos e,
  # numa mutation que o próprio usuário executa, seriam escalada de privilégio.
  editarUsuario(
    id: ID!
    nome: String
    email: String
    telefone: String
    senha: String
  ): Usuario @auth

  atualizarEndereco(
    latitude: Float
    longitude: Float
    endereco: String!
  ): Usuario @auth

  deletarUsuario(id: ID!): Boolean @auth
}

