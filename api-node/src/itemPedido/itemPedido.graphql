type ItemPedido {
  id: ID!
  pedido: Pedido
  produto: Produto
  quantidade: Int
  preco_unitario: Float
}


extend type Produto {
  itensPedido: [ItemPedido]
}

extend type Query {
  itensPedido: [ItemPedido] @auth(roles: ["RESTAURANTE"])
  itemPedido(id: ID!): ItemPedido @auth
}

extend type Mutation {
  criarItemPedido(
    pedido_id: ID!
    produto_id: ID!
    quantidade: Int!
    preco_unitario: Float!
  ): ItemPedido @auth

  editarItemPedido(
    id: ID!
    pedido_id: ID
    produto_id: ID
    quantidade: Int
    preco_unitario: Float
  ): ItemPedido @auth

  deletarItemPedido(id: ID!): Boolean @auth
}
