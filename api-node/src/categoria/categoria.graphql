type Categoria {
  id: ID!
  nome: String!
  restaurante: Restaurante
  produtos: [Produto]
}

extend type Restaurante {
  categorias: [Categoria]
}

extend type Query {
  categorias: [Categoria]
  categoria(id: ID!): Categoria
}

extend type Mutation {
  criarCategoria(
    nome: String!
    restaurante_id: ID!
  ): Categoria @auth(roles: ["RESTAURANTE"])

  editarCategoria(
    id: ID!
    nome: String
    restaurante_id: ID
  ): Categoria @auth(roles: ["RESTAURANTE"])

  deletarCategoria(id: ID!): Boolean @auth(roles: ["RESTAURANTE"])
}
